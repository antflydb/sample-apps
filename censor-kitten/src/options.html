<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Censor Kitten settings</title>
  <link rel="stylesheet" href="sidebar.css">
  <script type="module" src="options.js"></script>
</head>
<body class="settings">
  <header class="masthead"><div class="brand"><img src="kitten.svg" alt="" width="32" height="32"><h1>Censor Kitten settings</h1></div></header>
  <main>
    <form class="desk">
      <label for="prompt">Question for Laya</label>
      <p id="help">Ask a yes/no question. A high score for “yes” hides the text. Saved changes apply to new checks; reload a page to check it again.</p>
      <textarea id="prompt" aria-describedby="help" rows="4" required disabled></textarea>
      <div class="controls"><div><button id="save" type="submit" disabled>Save prompt</button> <button id="reset" type="button" disabled>Restore default</button></div><p id="saved" role="status"></p></div>
    </form>
  </main>
</body>
</html>
